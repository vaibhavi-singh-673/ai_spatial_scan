name: SpatialScan CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: python -m pytest -q

      - run: python -m spatialscan quality --tier lidar --input fixtures/lidar_sample --output /tmp/quality_lidar.json
      - run: python -m spatialscan quality --tier video --input fixtures/video --output /tmp/quality_video.json
      - run: python -m spatialscan report --input /tmp/quality_video.json --output /tmp/quality_video.html