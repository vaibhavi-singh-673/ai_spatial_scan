[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialscan"
version = "0.1.0"
description = "Reproducible three-tier indoor spatial reconstruction pipeline"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.9",
  "Pillow>=10",
  "scipy>=1.12",
  "shapely>=2.0",
  "matplotlib>=3.8",
  "pydantic>=2.7",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[project.scripts]
spatialscan = "spatialscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
